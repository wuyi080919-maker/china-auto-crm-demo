<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a2558"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>China Auto CRM Demo</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-192.png"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside><div class="brand">CA<span>CRM</span><small>DEMO</small></div><nav><button data-page="dashboard" class="active">总览</button><button data-page="customers">客户</button><button data-page="followups">跟进</button><button data-page="quotes">报价</button></nav><div class="demo-note">演示版<br>全部为虚拟数据</div></aside><main><header><div><p>CHINA AUTO EXPORT</p><h1 id="title">业务总览</h1></div><button id="addBtn" class="primary">＋ 新增客户</button></header><section id="content"></section></main></div>
